<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <script src="./js/script.js"></script>
</head>
<body>
    <h1>Ejercicio 5</h1>
    <h2>Clasificación de un número</h2>

    <input id="entradaEj1" type="text" placeholder="Introduce un número">
    <button id="ej1" type="button">Clasificar</button>

    <h2>Clasificación textual</h2>

    <input id="entradaEj2" type="text" placeholder="Nota entre 0 y 10">
    <button id="ej2" type="button">Calificar</button>

    <h2>Menú con Switch</h2>

    <input id="entradaEj3" type="text" placeholder="Opción 1, 2 o 3">
    <button id="ej3" type="button">Ejecutar opción</button>

    <h2>Presupuesto de envio</h2>

    <input id="entradaEj4" type="text" placeholder="Introduce el importe del pedido">
    <label>
        <input type="checkbox" name="Cuenta premium" id="EsPremium">
        Cuenta Premium
    </label>
    <button id="ej4" type="button">Calcular envio</button>
</body>
</html>
