<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba práctica 1 · DWEC UD2</title>
  <script src="js/codigo.js" defer></script>
</head>
<body>
  <h1>Tienda online · Prueba práctica 1</h1>
  <h2>1. Puesta en marcha</h2>
  <button type="button" id="btnInicio">Comprobar aplicación</button>
  <p id="salidaInicio"></p>

  <h2>2. Precio base</h2>
  <label for="precioBase">Precio unitario (€):</label>
  <input type="text" id="precioBase">
  <label for="unidadesBase">Unidades:</label>
  <input type="text" id="unidadesBase">
  <button type="button" id="btnBase">Calcular importe</button>
  <p id="salidaBase"></p>

  <h2>3. Ámbito de variables</h2>
  <label for="tipoCliente">Tipo de cliente (NORMAL o SOCIO):</label>
  <input type="text" id="tipoCliente">
  <button type="button" id="btnAmbito">Mostrar mensaje</button>
  <p id="salidaAmbito"></p>

  <h2>4. Conversión y validación</h2>
  <label for="precioValidar">Precio (€):</label>
  <input type="text" id="precioValidar">
  <label for="cantidadValidar">Cantidad:</label>
  <input type="text" id="cantidadValidar">
  <button type="button" id="btnValidar">Validar compra</button>
  <p id="salidaValidar"></p>

  <h2>5. Descuento y envío</h2>
  <label for="importePedido">Importe del pedido (€):</label>
  <input type="text" id="importePedido">
  <label for="codigoCliente">Cliente (NORMAL o SOCIO):</label>
  <input type="text" id="codigoCliente">
  <button type="button" id="btnPedido">Calcular total</button>
  <p id="salidaPedido"></p>
</body>
</html>
