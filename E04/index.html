<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio DWEC</title>
    <script src="./js/codigo.js"></script>
</head>
<body>
    <h1>Conversiones de tipo</h1>
    
    <!-- Ejercicio 1: Laboratorio de conversiones -->
    <h2>1. Laboratorio de conversiones</h2>
    <button id="ej1" onclick="ejecutarEj1()">Ejecutar ej1</button>
    <div id="salidaEj1">Revisa la consola del navegador.</div>

    <hr>

    <!-- Ejercicio 2: Entrada numérica segura -->
    <h2>2. Entrada numérica segura</h2>
    <input type="text" id="inputSeguro" placeholder="Introduce un número">
    <button id="ej2" onclick="ejecutarEj2()">Ejecutar ej2</button>
    <div id="salidaSegura"></div>

    <hr>

    <!-- Ejercicio 3: Conversor de temperatura -->
    <h2>3. Conversor de temperatura</h2>
    <input type="text" id="inputTemp" placeholder="Grados Celsius">
    <button id="ej3" onclick="ejecutarEj3()">Ejecutar ej3</button>
    <div id="salidaTemp"></div>

    <hr>

    <!-- Ejercicio 4: Conversión frente a concatenación -->
    <h2>4. Conversión frente a concatenación</h2>
    <input type="text" id="num1" placeholder="Número 1" value="5">
    <input type="text" id="num2" placeholder="Número 2" value="3">
    <button id="ej4" onclick="ejecutarEj4()">Ejecutar ej4</button>
    <div id="salidaSuma"></div>

</body>
</html>
